# -------------------------------------------------------------------------
# Aim: koshiv Development Environment Docker Compose
# Why: Isolated local development stack running strictly over Tailscale
#      private network. Every configurable value extracted into environment
#      variables — zero hardcoded IPs, ports, container names, credentials,
#      or resource limits. This ensures the compose file remains environment-
#      agnostic, secure even when stored in version control, and deployable
#      across dev/staging/production by simply swapping the .env file.
#      Services communicate internally via isolated bridge network.
# -------------------------------------------------------------------------

services:

  # -----------------------------------------------------------------------
  # Aim: PostgreSQL 16 Database Service
  # Why: Core relational database for koshiv platform. Stores all structured
  #      data — student profiles, learning progress, quiz results, parent
  #      dashboards. PostgreSQL 16 chosen for advanced JSON capabilities,
  #      robust role-based access control, and proven reliability. IP, port,
  #      credentials, container name, restart policy, healthcheck parameters,
  #      and resource limits all sourced from environment variables — ensuring
  #      zero hardcoded values for maximum security and deployment flexibility.
  #      Custom high port mapped exclusively to Tailscale private IP prevents
  #      default 5432 port scanning attacks on public interfaces.
  # -----------------------------------------------------------------------
  postgres_koshiv_dev:
    image: postgres:16-alpine
    container_name: ${KOSHIV_POSTGRES_DEV_CONTAINER_NAME}
    restart: ${KOSHIV_POSTGRES_DEV_RESTART_POLICY}
    environment:
      POSTGRES_USER: ${KOSHIV_POSTGRES_DEV_USER}
      POSTGRES_PASSWORD: ${KOSHIV_POSTGRES_DEV_PASSWORD}
      POSTGRES_DB: ${KOSHIV_POSTGRES_DEV_DB}
    ports:
      - "${KOSHIV_TAILSCALE_IP}:${KOSHIV_POSTGRES_DEV_PORT}:5432"
    volumes:
      - ${KOSHIV_POSTGRES_DEV_VOLUME_NAME}:/var/lib/postgresql/data
      - ../../database_layer/postgres_schema:/docker-entrypoint-initdb.d:ro
    networks:
      - ${KOSHIV_TAILSCALE_DEV_NETWORK_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KOSHIV_POSTGRES_DEV_USER} -d ${KOSHIV_POSTGRES_DEV_DB}"]
      interval: ${KOSHIV_POSTGRES_DEV_HEALTHCHECK_INTERVAL}
      timeout: ${KOSHIV_POSTGRES_DEV_HEALTHCHECK_TIMEOUT}
      retries: ${KOSHIV_POSTGRES_DEV_HEALTHCHECK_RETRIES}
      start_period: ${KOSHIV_POSTGRES_DEV_HEALTHCHECK_START_PERIOD}
    deploy:
      resources:
        limits:
          cpus: ${KOSHIV_POSTGRES_DEV_CPU_LIMIT}
          memory: ${KOSHIV_POSTGRES_DEV_MEMORY_LIMIT}
        reservations:
          cpus: ${KOSHIV_POSTGRES_DEV_CPU_RESERVATION}
          memory: ${KOSHIV_POSTGRES_DEV_MEMORY_RESERVATION}

  # -----------------------------------------------------------------------
  # Aim: PgAdmin4 Web-Based PostgreSQL Administration Interface
  # Why: Provides a browser-based GUI for database management — schema
  #      browsing, query execution, user management, and data visualization.
  #      Essential during development for debugging queries, inspecting
  #      table structures, and monitoring database health without needing
  #      CLI access to the container. Bound strictly to Tailscale private
  #      IP with a custom high port (above 30000) to prevent exposure on
  #      default PgAdmin port 80/5050. Admin credentials, container name,
  #      restart policy, and all configurable parameters sourced from
  #      environment variables — no hardcoded secrets in version control.
  # -----------------------------------------------------------------------
  pgadmin4_koshiv_dev:
    image: dpage/pgadmin4:latest
    container_name: ${KOSHIV_PGADMIN_DEV_CONTAINER_NAME}
    restart: ${KOSHIV_PGADMIN_DEV_RESTART_POLICY}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${KOSHIV_PGADMIN_DEV_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${KOSHIV_PGADMIN_DEV_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${KOSHIV_TAILSCALE_IP}:${KOSHIV_PGADMIN_DEV_PORT}:80"
    volumes:
      - ${KOSHIV_PGADMIN_DEV_VOLUME_NAME}:/var/lib/pgadmin
      - ../../database_layer/pgadmin_setup/servers.json:/pgadmin4/servers.json:ro
    networks:
      - ${KOSHIV_TAILSCALE_DEV_NETWORK_NAME}
    depends_on:
      postgres_koshiv_dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/misc/ping || exit 1"]
      interval: ${KOSHIV_PGADMIN_DEV_HEALTHCHECK_INTERVAL}
      timeout: ${KOSHIV_PGADMIN_DEV_HEALTHCHECK_TIMEOUT}
      retries: ${KOSHIV_PGADMIN_DEV_HEALTHCHECK_RETRIES}
      start_period: ${KOSHIV_PGADMIN_DEV_HEALTHCHECK_START_PERIOD}
    deploy:
      resources:
        limits:
          cpus: ${KOSHIV_PGADMIN_DEV_CPU_LIMIT}
          memory: ${KOSHIV_PGADMIN_DEV_MEMORY_LIMIT}
        reservations:
          cpus: ${KOSHIV_PGADMIN_DEV_CPU_RESERVATION}
          memory: ${KOSHIV_PGADMIN_DEV_MEMORY_RESERVATION}

  # -----------------------------------------------------------------------
  # Aim: Redis 7 In-Memory Caching & Session Store
  # Why: High-performance in-memory data store for koshiv platform. Handles
  #      session management (student login sessions with TTL), API response
  #      caching (reducing PostgreSQL load for repeated queries), and rate
  #      limiting counters. Redis 7 chosen for its improved memory efficiency
  #      and AOF (Append-Only File) persistence — ensures cache data survives
  #      container restarts. Password authentication mandatory even in dev
  #      environment — prevents accidental unprotected cache access. Bound
  #      strictly to Tailscale private IP with custom high port above 30000
  #      to avoid default 6379 port scanning. All parameters — IP, port,
  #      password, container name, restart policy, persistence settings,
  #      healthcheck intervals, and resource limits — sourced from environment
  #      variables. Zero hardcoded values ensure security compliance across
  #      all deployment environments.
  # -----------------------------------------------------------------------
  redis_koshiv_dev:
    image: redis:7-alpine
    container_name: ${KOSHIV_REDIS_DEV_CONTAINER_NAME}
    restart: ${KOSHIV_REDIS_DEV_RESTART_POLICY}
    command: >
      redis-server
      --port ${KOSHIV_REDIS_DEV_INTERNAL_PORT}
      --requirepass ${KOSHIV_REDIS_DEV_PASSWORD}
      --appendonly yes
      --appendfsync ${KOSHIV_REDIS_DEV_AOF_FSYNC_POLICY}
      --maxmemory ${KOSHIV_REDIS_DEV_MAXMEMORY}
      --maxmemory-policy ${KOSHIV_REDIS_DEV_EVICTION_POLICY}
      --save ""
      --databases ${KOSHIV_REDIS_DEV_DATABASES}
      --tcp-backlog ${KOSHIV_REDIS_DEV_TCP_BACKLOG}
      --timeout ${KOSHIV_REDIS_DEV_CLIENT_TIMEOUT}
      --tcp-keepalive ${KOSHIV_REDIS_DEV_TCP_KEEPALIVE}
    ports:
      - "${KOSHIV_TAILSCALE_IP}:${KOSHIV_REDIS_DEV_PORT}:${KOSHIV_REDIS_DEV_INTERNAL_PORT}"
    volumes:
      - ${KOSHIV_REDIS_DEV_VOLUME_NAME}:/data
    networks:
      - ${KOSHIV_TAILSCALE_DEV_NETWORK_NAME}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${KOSHIV_REDIS_DEV_INTERNAL_PORT} -a ${KOSHIV_REDIS_DEV_PASSWORD} ping | grep PONG"]
      interval: ${KOSHIV_REDIS_DEV_HEALTHCHECK_INTERVAL}
      timeout: ${KOSHIV_REDIS_DEV_HEALTHCHECK_TIMEOUT}
      retries: ${KOSHIV_REDIS_DEV_HEALTHCHECK_RETRIES}
      start_period: ${KOSHIV_REDIS_DEV_HEALTHCHECK_START_PERIOD}
    deploy:
      resources:
        limits:
          cpus: ${KOSHIV_REDIS_DEV_CPU_LIMIT}
          memory: ${KOSHIV_REDIS_DEV_MEMORY_LIMIT}
        reservations:
          cpus: ${KOSHIV_REDIS_DEV_CPU_RESERVATION}
          memory: ${KOSHIV_REDIS_DEV_MEMORY_RESERVATION}

# -------------------------------------------------------------------------
# Aim: Named Volumes
# Why: Persistent data storage decoupled from container lifecycle. Volume
#      names sourced from environment variables allow per-environment
#      isolation — dev, staging, production volumes never collide. Each
#      service gets its own dedicated volume for data integrity. Local
#      driver explicitly declared for clarity and auditability.
# -------------------------------------------------------------------------
volumes:
  ${KOSHIV_POSTGRES_DEV_VOLUME_NAME}:
    name: ${KOSHIV_POSTGRES_DEV_VOLUME_NAME}
    driver: local
  ${KOSHIV_PGADMIN_DEV_VOLUME_NAME}:
    name: ${KOSHIV_PGADMIN_DEV_VOLUME_NAME}
    driver: local
  ${KOSHIV_REDIS_DEV_VOLUME_NAME}:
    name: ${KOSHIV_REDIS_DEV_VOLUME_NAME}
    driver: local

# -------------------------------------------------------------------------
# Aim: Tailscale Private Bridge Network
# Why: All koshiv services communicate strictly over this isolated bridge
#      network. External access only via Tailscale private IP — no service
#      ever binds to 0.0.0.0 or 127.0.0.1. Network name from variable
#      ensures environment-specific isolation. Single shared network allows
#      inter-service communication (e.g., PgAdmin → PostgreSQL, Backend →
#      Redis) without exposing ports publicly. Bridge driver explicitly
#      declared for clarity and auditability.
# -------------------------------------------------------------------------
networks:
  ${KOSHIV_TAILSCALE_DEV_NETWORK_NAME}:
    name: ${KOSHIV_TAILSCALE_DEV_NETWORK_NAME}
    driver: bridge